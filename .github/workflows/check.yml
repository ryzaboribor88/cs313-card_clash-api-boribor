# CS 313 automatic check. Runs on GitHub after every push.
# DO NOT EDIT THIS FILE. Changing the check is treated as an academic-integrity matter.
name: CS 313 check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Hub Contract and set-up check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ci_game
      DB_USER: postgres
      DB_PASSWORD: postgres
      HUB_API_KEY: ci-check-hub-key

    steps:
      - name: Get the code, with its full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the packages
        run: npm ci

      - name: Create the database
        run: npm run db:create

      - name: Run the CS 313 check (the scorecard is in the Summary tab)
        run: npm run check
